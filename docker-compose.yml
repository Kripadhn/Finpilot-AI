# `make up` starts the mock API. Add your services here (EN-1).
# Optional tools: docker compose --profile ollama --profile jaeger up -d
services:
  mock-bank-api:
    build:
      context: .
      dockerfile: mock-bank-api/Dockerfile
    env_file: .env
    environment:
      BANK_DB_PATH: /app/data/bank.db
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  jaeger:
    profiles: [jaeger]
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:local-dev-only@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-only
      SALT: local-dev-only
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"

  langfuse-db:
    profiles: [langfuse]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - langfuse-db:/var/lib/postgresql/data

volumes:
  ollama-models:
  langfuse-db:
