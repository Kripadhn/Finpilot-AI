# `make up` starts the mock API, MCP server, agent and chat host (EN-1), each with a health check.
# Optional tools: docker compose --profile ollama --profile jaeger up -d
# The agent reaches Ollama on the host by default. With `--profile ollama`, set
# OLLAMA_BASE_URL=http://ollama:11434 in .env instead.
services:
  mock-bank-api:
    build:
      context: .
      dockerfile: mock-bank-api/Dockerfile
    env_file: .env
    environment:
      BANK_DB_PATH: /app/data/bank.db
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./data:/app/data

  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    env_file: .env
    environment:
      MOCK_API_URL: http://mock-bank-api:8001
      MCP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      mock-bank-api:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    env_file: .env
    environment:
      MCP_URL: http://mcp-server:8002/mcp
      AGENT_HOST: 0.0.0.0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_IN_DOCKER:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8003:8003"
    depends_on:
      mcp-server:
        condition: service_healthy

  host:
    build:
      context: .
      dockerfile: host/Dockerfile
    environment:
      # Optional showcase password (HTTP Basic). Empty means no password.
      DEMO_USER: ${DEMO_USER:-demo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      # Set BIND_ADDRESS=0.0.0.0 to reach the host from another machine (put HTTPS in front).
      - "${BIND_ADDRESS:-127.0.0.1}:5173:5173"
    depends_on:
      agent:
        condition: service_healthy

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama

  jaeger:
    profiles: [jaeger]
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  langfuse:
    profiles: [langfuse]
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:local-dev-only@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-only
      SALT: local-dev-only
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"

  langfuse-db:
    profiles: [langfuse]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: langfuse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - langfuse-db:/var/lib/postgresql/data

volumes:
  ollama-models:
  langfuse-db:
