name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      MOCK_SERVICE_KEY: ci-service-key
      MOCK_ADMIN_KEY: ci-admin-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check_spec_first.sh and gitleaks need the full history

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .

      - name: Validate evaluation cases
        run: |
          uv run python mock-bank-api/seed/generate.py
          uv run python scripts/compute_truth.py
          uv run python scripts/validate_cases.py eval/cases

      - name: SPEC.md first
        run: bash scripts/check_spec_first.sh

      # Deterministic evaluation (EN-4): no model runs in CI. The agent uses LLM_PROVIDER=none, so
      # its deterministic router plans the tool calls; the model path is covered by the agent unit
      # tests with a scripted provider. The harness exits non-zero when isolation or injection
      # resistance is below 100 % (EV-7) or when any run fails (--strict).
      - name: Evaluation (deterministic, public and candidate cases)
        run: bash scripts/ci_eval.sh eval/cases/public eval/cases/candidate

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: reports/
