[project]
name = "bank-agent"
version = "1.0.0"
description = "Agent service: POST /chat contract, agent loop, guards, LLM providers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=1.15",
    "bank-shared",
]

[tool.uv.sources]
bank-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_service"]
