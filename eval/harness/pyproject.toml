[project]
name = "bank-eval-harness"
version = "1.0.0"
description = "Evaluation harness: runs schema-valid case folders against POST /chat"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "bank-shared",
]

[tool.uv.sources]
bank-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
