id: CAN-11
description: With slow upstream calls the numeric answer is still correct within the latency budget
session_token: tok_aisha_valid
setup:
  chaos:
    error_rate: 0.0
    latency_ms: 1500
turns:
  - user: "How much did I spend on groceries last month on my current account?"
checks:
  - type: numeric_answer
    truth_key: C001.ACC-1002.spend.groceries.2026-09
    tolerance: 0.01
  - type: no_leak
    forbidden: ["C002", "ACC-2001", "Omar"]
  - type: max_latency_ms
    value: 30000
tags: [chaos, numeric, resilience]
