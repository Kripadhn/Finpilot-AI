<!doctype html>
<!-- Thin chat host (UI-5): posts to the agent's /chat, keeps the conversation id, renders
     returned MCP Apps views in sandboxed iframes and bridges them per spec 2026-01-26.
     No external resources; tool calls from views go through POST /ui/tool only (UI-8). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DVT Agentic Bank — demo host</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; flex-direction: column; height: 100vh;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: light-dark(#1a1d21, #e8eaed);
    background: light-dark(#f6f7f9, #141518);
  }
  header {
    display: flex; gap: 10px; align-items: center; padding: 10px 16px;
    background: light-dark(#ffffff, #1e1f22);
    border-bottom: 1px solid light-dark(#e3e5e8, #2d2e31);
  }
  header h1 { font-size: 15px; margin: 0; flex: 1; }
  header select, header button {
    font: inherit; padding: 5px 10px; border-radius: 7px;
    border: 1px solid light-dark(#d0d3d8, #3c4043);
    background: light-dark(#ffffff, #26272b); color: inherit;
  }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 780px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .user { align-self: flex-end; background: light-dark(#d7e7ff, #28415e); }
  .bot  { align-self: flex-start; background: light-dark(#ffffff, #1e1f22);
          border: 1px solid light-dark(#e3e5e8, #2d2e31); }
  .meta { font-size: 11px; color: light-dark(#80868b, #80868b); margin-top: 6px; }
  .view-frame {
    align-self: stretch; max-width: 820px; width: 100%; border: 1px solid light-dark(#e3e5e8, #2d2e31);
    border-radius: 12px; background: light-dark(#ffffff, #1e1f22); height: 240px;
  }
  form { display: flex; gap: 10px; padding: 12px 16px;
         background: light-dark(#ffffff, #1e1f22);
         border-top: 1px solid light-dark(#e3e5e8, #2d2e31); }
  form input { flex: 1; font: inherit; padding: 10px 12px; border-radius: 9px;
               border: 1px solid light-dark(#d0d3d8, #3c4043);
               background: light-dark(#ffffff, #26272b); color: inherit; }
  form button { font: inherit; padding: 10px 18px; border-radius: 9px; border: 0;
                background: light-dark(#1a73e8, #8ab4f8);
                color: light-dark(#ffffff, #1e1f22); cursor: pointer; }
  form button:disabled { opacity: .5; }
  .error { color: light-dark(#b3261e, #f2b8b5); }
</style>
</head>
<body>
<header>
  <h1>DVT Agentic Bank</h1>
  <label>Session:
    <select id="token">
      <option value="tok_aisha_valid">Aisha (valid)</option>
      <option value="tok_omar_valid">Omar (valid)</option>
      <option value="tok_lina_valid">Lina (valid)</option>
      <option value="tok_aisha_expired">Aisha (expired)</option>
    </select>
  </label>
  <button id="reset" type="button">New conversation</button>
</header>
<main id="chat" aria-live="polite"></main>
<form id="form">
  <input id="input" placeholder="e.g. Show me my last 20 transactions on my savings account"
         autocomplete="off" aria-label="Message" />
  <button id="send" type="submit">Send</button>
</form>
<script src="config.js"></script>
<script src="host.js"></script>
</body>
</html>
