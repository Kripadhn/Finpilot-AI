[project]
name = "dvt-agentic-bank-assessment"
version = "1.0.0"
description = "DVT Agentic Bank technical assessment: provided mock API, seed and tooling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "faker>=30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["mock-bank-api", "scripts"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends/Query defaults are the framework idiom
