[project]
name = "Finpilot-AI"
version = "1.0.0"
description = "Finpilot-AI Agentic Bank technical assessment: provided mock API, seed and tooling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "faker>=30",
]

[dependency-groups]
# The workspace packages live in dev so the mock API image (uv sync --no-dev) stays slim.
dev = [
    "bank-shared",
    "mcp-bank-server",
    "bank-agent",
    "bank-eval-harness",
    "asgi-lifespan>=2.1",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pyyaml>=6.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "mcp-server", "agent", "eval/harness"]

[tool.uv.sources]
bank-shared = { workspace = true }
mcp-bank-server = { workspace = true }
bank-agent = { workspace = true }
bank-eval-harness = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["mock-bank-api", "scripts"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI's Depends/Query defaults are the framework idiom
